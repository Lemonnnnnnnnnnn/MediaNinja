name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Cache pinned FFmpeg source build
        uses: actions/cache@v4
        with:
          path: |
            .cache/release-tools
            .cache/ffmpeg
          key: ffmpeg-windows-x64-${{ hashFiles('scripts/ffmpeg.lock.json', 'scripts/build-ffmpeg.sh', 'scripts/ffmpeg.mjs') }}
      - run: pnpm install --frozen-lockfile
      - name: Verify version and tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            pnpm version:check --tag $env:GITHUB_REF_NAME
          } else {
            pnpm version:check
          }
      - name: Test, build and package
        run: pnpm release:build
      - name: Upload distribution assets
        uses: actions/upload-artifact@v4
        with:
          name: medianinja-windows-x64
          path: release/*
          if-no-files-found: error

  release:
    name: Create release draft
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: medianinja-windows-x64
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MediaNinja ${{ github.ref_name }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release/release-notes.md
          fail_on_unmatched_files: true
          files: |
            release/*.exe
            release/*.zip
            release/*.tar.xz
            release/ffmpeg-build.json
            release/build-ffmpeg.sh
            release/SHA256SUMS.txt
